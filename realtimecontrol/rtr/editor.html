<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTR zone editor</title>
<style>
  :root { --bg: #111318; --panel: #181c24; --border: #2a2f3a; --text: #d7dbe2; --dim: #7c8494; --accent: #4fc08d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #e05d5d; }
  .dot.on { background: var(--accent); }
  #status { color: var(--dim); }
  #host { background: #0d0f13; color: var(--text); border: 1px solid var(--border);
          padding: 6px 8px; width: 220px; font: inherit; }
  button { background: #22262f; color: var(--text); border: 1px solid var(--border);
           border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
  button.small { padding: 2px 7px; font-size: 12px; }
  #saveMsg { color: var(--dim); font-size: 12px; }
  #saveMsg.err { color: #e05d5d; }
  main { display: grid; gap: 16px; grid-template-columns: 210px 1fr 380px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 10px; }
  h3 { font-size: 12px; color: var(--dim); margin: 14px 0 6px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  label { font-size: 11px; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }
  label.inline { flex-direction: row; justify-content: space-between; align-items: center; font-size: 13px; }
  input[type=number] { width: 100%; background: #0d0f13; color: var(--text); border: 1px solid var(--border);
                       border-radius: 4px; padding: 3px 5px; font: inherit; }
  input[type=checkbox] { width: 16px; height: 16px; }
  .zoneList { display: flex; flex-direction: column; gap: 4px; }
  .zoneList button { width: 100%; text-align: left; }
  .action { border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .actionHead { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .actionHead input[type=text] { background: #0d0f13; color: var(--text); border: 1px solid var(--border);
                                 border-radius: 4px; padding: 3px 6px; font: inherit; width: 110px; }
  .poseRow { display: grid; grid-template-columns: repeat(6, 1fr) 56px 22px; gap: 4px;
             margin-bottom: 4px; align-items: center; }
  .poseRow input[type=number] { padding: 2px 4px; }
  #robot3d { width: 100%; height: 320px; border: 1px solid var(--border); border-radius: 6px;
             overflow: hidden; background: #0d0f13; }
  #robot3d canvas { display: block; }
  .axis { margin-bottom: 8px; }
  .axis .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 0; }
  .bar { height: 6px; background: #0d0f13; border-radius: 3px; margin-top: 3px; position: relative; overflow: hidden; }
  .bar .mark { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .stateRow { display: flex; justify-content: space-between; padding: 2px 0;
               border-bottom: 1px solid #20242d; font-size: 13px; }
  .stateRow > span:first-child { color: var(--dim); }
  .warn { color: #e0a030; font-size: 12px; }
  .hwlims { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  #tabZones, #tabSound { font-size: 12px; }
  .sndMain { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
  .sndRow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .sndName { min-width: 78px; font-size: 13px; }
  .msgForm { display: inline-flex; gap: 4px; align-items: center; }
  .msgType { background: #0d0f13; color: var(--text); border: 1px solid var(--border);
             border-radius: 4px; padding: 2px 4px; font: inherit; }
  .msgFields { display: inline-flex; gap: 4px; align-items: center; }
  .msgFields label { display: inline-flex; gap: 3px; align-items: baseline; font-size: 11px; color: var(--dim); }
  .msgFields input[type=number] { width: 62px; background: #0d0f13; color: var(--text);
                                   border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; font: inherit; }
  .sndPoses { margin: 2px 0 6px 86px; }
  #patchesMain { display: grid; gap: 16px; grid-template-columns: 210px 1fr 380px; align-items: start; }
  .patchList { display: flex; flex-direction: column; gap: 4px; }
  .patchList button { width: 100%; text-align: left; }
  .patchList .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                     color: var(--dim); margin: 8px 0 2px; }
  .patchList .grp:first-child { margin-top: 0; }
  #patchCode { width: 100%; min-height: 220px; resize: vertical; background: #0d0f13;
               color: var(--text); border: 1px solid var(--border); border-radius: 4px;
               padding: 8px; font: inherit; white-space: pre; }
  #patchPreview { width: 100%; height: 360px; border: 1px solid var(--border);
                  border-radius: 6px; overflow: hidden; background: #0d0f13; }
  #patchPreview canvas { display: block; width: 100%; height: 100%; }
  #patchInfo { font-size: 12px; color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>RTR zone editor</h1>
  <span class="dot" id="dot"></span><span id="status">disconnected</span>
  <input id="host" value="ws://localhost:8765" spellcheck="false">
  <button id="connect">connect</button>
  <button id="tabZones" class="active">zones</button>
  <button id="tabSound">sound</button>
  <button id="tabPatches">patches</button>
  <button id="save">save</button>
  <span id="saveMsg"></span>
</header>

<main id="zoneMain">
  <section>
    <h2>zones</h2>
    <div class="zoneList" id="zoneList"></div>
    <div class="row" style="margin-top:8px">
      <button id="addZone">+ add zone</button>
      <button id="delZone" class="small">remove</button>
    </div>
  </section>

  <section>
    <h2 id="zoneTitle">zone</h2>
    <div id="zoneForm"></div>
  </section>

  <section>
    <h2>3d preview</h2>
    <div id="robot3d"></div>
    <h3>safezone (selected zone)</h3>
    <div id="bars"></div>
    <h3>hardware limits (xacro floor)</h3>
    <div id="hwLimits" class="hwlims"></div>
    <h3>ghost arm — step action poses</h3>
    <div class="row">
      <button id="ghostPrev">prev</button>
      <button id="ghostNext">next</button>
      <span id="ghostInfo" style="font-size:12px;color:var(--dim)"></span>
    </div>
    <h3>live state</h3>
    <div id="liveState"><span style="color:var(--dim);font-size:13px">waiting…</span></div>
  </section>
</main>

<main id="soundMain" class="sndMain" style="display:none">
  <section>
    <h2>channel</h2>
    <div id="sndChannel"></div>
    <h2 style="margin-top:12px">zones (zone entry)</h2>
    <div id="sndZones"></div>
  </section>
  <section>
    <h2>modes (mode change)</h2>
    <div id="sndModes"></div>
  </section>
  <section>
    <h2>actions (start + per-pose)</h2>
    <div id="sndActions"></div>
    <div class="row" style="margin-top:8px">
      <button id="addSoundAction">+ add action</button>
    </div>
  </section>
</main>

<main id="patchesMain" style="display:none">
  <section>
    <h2>patch slots</h2>
    <div class="patchList" id="patchList"></div>
  </section>
  <section>
    <h2 id="patchTitle">patch code</h2>
    <div class="row" style="margin-bottom:8px">
      <button id="patchAdd">+ add action patch</button>
      <button id="patchRemove" class="small">remove</button>
    </div>
    <textarea id="patchCode" spellcheck="false"></textarea>
    <div id="patchInfo"></div>
  </section>
  <section>
    <h2>live preview</h2>
    <div id="patchPreview"></div>
    <div id="patchStatus" style="font-size:12px;color:var(--dim);margin-top:6px">preview</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>
<script src="rtr3d.js"></script>
<script>
"use strict";

const AXES = ["A1", "A2", "A3", "A4", "A5", "A6"];
const MODES = ["wander", "random", "action", "track", "hold"];
const $ = (id) => document.getElementById(id);

// Minimal fallback table (last resort when both /api/zones and /zones.json fail,
// e.g. opened from file://). The real table comes from the core over HTTP.
const FALLBACK = {
  zones: {
    init: { safezone: [[-94,122],[-105,-65],[89,115],[-15,15],[-15,45],[-357,357]],
            exits: ["rest"], actions: {}, startpos: [-60,-90,90,0,15,0],
            exitpos: [-4,-131,155,3,-10,0], speed: 20, enabled: true},
  },
  poses: {}, lin_poses: {},
};

// Last-resort sound mapping (mirrors rtr/sound/sound.py ZONE_NOTES/MODE_CCS). Used
// when both /api/sound and /sound.json fail (e.g. opened from file://).
const SOUND_FALLBACK = {
  channel: 0,
  zones: {
    init: {note:48, velocity:60}, rest: {note:36, velocity:50}, wakeup: {note:52, velocity:70},
    stretch: {note:55, velocity:75}, wander: {note:60, velocity:80}, wildwander: {note:64, velocity:90},
  },
  modes: {
    wander: {cc:70, value:32}, random: {cc:70, value:64}, action: {cc:70, value:96},
    track: {cc:70, value:127}, hold: {cc:70, value:0},
  },
  actions: {},
};

// Hardware joint limits (deg) from the kr60ha xacro — the hard safety floor the core
// clamps every pose to. Fallback mirrors the xacro; over HTTP it is replaced by
// GET /api/limits (same pattern as the zones/sound fallbacks).
const HW_LIMITS_FALLBACK = [
  [-185, 185],   // A1
  [-135, 35],    // A2
  [-120, 158],   // A3
  [-350, 350],   // A4
  [-119, 119],   // A5
  [-350, 350],   // A6
];
let HW_LIMITS = HW_LIMITS_FALLBACK.slice();

let TABLE = null;
let SOUND = null;
let PATCHES = null;
let soundView = false;
let patchView = false;
let selectedZone = null;
let selectedAction = null;
let selectedPatch = null;   // the current patch slot key
let patchHydra = null;      // the live-preview hydra instance
let patchTimer = null;      // debounce timer for the live preview
let ghostIndex = 0;
let ws = null;

// Last-resort patches table (mirrors rtr/patches/patches.py DEFAULT_HYDRA_CODE).
// Used when both /api/patches and /patches.json fail (e.g. opened from file://).
const PATCHES_FALLBACK = {
  default: "osc(4, 0.1, 1.2).out()",
  zones: {}, modes: {}, actions: {},
};

// ---------------------------------------------------------------------------
// WebSocket (live mirror: the current arm follows the robot).
// ---------------------------------------------------------------------------
function connect() {
  const url = $("host").value.trim();
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  ws = new WebSocket(url);
  ws.onopen = () => { $("dot").className = "dot on"; $("status").textContent = "connected"; };
  ws.onclose = () => {
    $("dot").className = "dot"; $("status").textContent = "disconnected";
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === "state") {
      Robot3D.update({ joints: m.joints, target: m.target });
      $("liveState").innerHTML =
        `<div class="stateRow"><span>zone</span><span>${m.zone}</span></div>` +
        `<div class="stateRow"><span>mode</span><span>${m.mode}</span></div>` +
        `<div class="stateRow"><span>action</span><span>${m.action ? m.action : "—"}</span></div>` +
        `<div class="stateRow"><span>speed</span><span>${m.speed}</span></div>` +
        `<div class="stateRow"><span>moving</span><span>${m.moving ? "yes" : "no"}</span></div>`;
    } else if (m.type === "sound_changed") {
      // The running core reloaded the sound mapping; re-fetch it.
      loadSound().then(() => { if (soundView) buildSoundForm(); });
    } else if (m.type === "patches_changed") {
      // The running core reloaded the hydra patches; re-fetch them.
      loadPatches().then(() => { if (patchView) buildPatchesForm(); });
    }
  };
}

function send(cmd) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { $("saveMsg").textContent = "not connected"; return; }
  ws.send(JSON.stringify(cmd));
}

// ---------------------------------------------------------------------------
// Load the zone table (API -> zones.json -> built-in fallback).
// ---------------------------------------------------------------------------
async function loadTable() {
  let data = null, source = "fallback";
  try {
    const r = await fetch("/api/zones", { cache: "no-store" });
    if (r.ok) { data = await r.json(); source = "api"; }
  } catch (e) {}
  if (!data) {
    try {
      const r = await fetch("/zones.json", { cache: "no-store" });
      if (r.ok) { data = await r.json(); source = "file"; }
    } catch (e) {}
  }
  if (!data) data = FALLBACK;
  TABLE = data;
  if (!TABLE.zones) TABLE.zones = {};
  const names = Object.keys(TABLE.zones);
  selectedZone = names[0] || null;
  buildZoneList();
  selectZone(selectedZone);
  $("saveMsg").textContent = source === "api" ? "live" : (source === "file" ? "from zones.json" : "offline (built-in)");
}

// ---------------------------------------------------------------------------
// Load the hardware limits (API -> built-in fallback mirroring the xacro).
// ---------------------------------------------------------------------------
async function loadLimits() {
  try {
    const r = await fetch("/api/limits", { cache: "no-store" });
    if (r.ok) {
      const data = await r.json();
      if (data && Array.isArray(data.hardware_limits) && data.hardware_limits.length === 6) {
        HW_LIMITS = data.hardware_limits;
      }
    }
  } catch (e) {}
  buildHwLimitsRow();
}

// Render the per-axis hardware limits as a compact reference row (a static floor —
// it does not depend on the selected zone).
function buildHwLimitsRow() {
  const el = $("hwLimits");
  if (!el) return;
  el.innerHTML = "";
  AXES.forEach((n, i) => {
    const [lo, hi] = HW_LIMITS[i];
    const s = document.createElement("span");
    s.textContent = n + " [" + lo + ", " + hi + "]";
    el.appendChild(s);
  });
}

// ---------------------------------------------------------------------------
// Load the sound mapping (API -> sound.json -> built-in fallback).
// ---------------------------------------------------------------------------
async function loadSound() {
  let data = null;
  try {
    const r = await fetch("/api/sound", { cache: "no-store" });
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {
    try {
      const r = await fetch("/sound.json", { cache: "no-store" });
      if (r.ok) data = await r.json();
    } catch (e) {}
  }
  if (!data) data = JSON.parse(JSON.stringify(SOUND_FALLBACK));
  SOUND = data;
  if (SOUND.zones === undefined) SOUND.zones = {};
  if (SOUND.modes === undefined) SOUND.modes = {};
  if (SOUND.actions === undefined) SOUND.actions = {};
  if (SOUND.channel === undefined) SOUND.channel = 0;
  // Seed the action list from the union of the zone table's action names (globally
  // keyed). Only fills names that are not already present, so an edited mapping
  // keeps its own actions.
  const names = Object.keys(TABLE.zones || {}).flatMap((n) => Object.keys(TABLE.zones[n].actions || {}));
  names.forEach((an) => {
    if (!SOUND.actions[an]) SOUND.actions[an] = { start: { note: 60, velocity: 60 }, poses: [] };
  });
  if (soundView) buildSoundForm();
  return SOUND;
}

// ---------------------------------------------------------------------------
// Sound editor.
//
// A MIDI message is one of: {note, velocity}, {cc, value}, or {program}. Each is
// edited inline; the global channel is applied by the core when sending.
// ---------------------------------------------------------------------------
function msgType(msg) {
  if (msg && (msg.note !== undefined || msg.velocity !== undefined)) return "note";
  if (msg && (msg.cc !== undefined || msg.value !== undefined)) return "cc";
  if (msg && msg.program !== undefined) return "program";
  return "note";
}

function freshMsg(type) {
  if (type === "cc") return { cc: 70, value: 64 };
  if (type === "program") return { program: 0 };
  return { note: 60, velocity: 60 };
}

// Build an inline MIDI-message editor. Field edits mutate ``msg`` in place; a type
// change calls ``onType(freshMsg)`` so the caller can swap the object and rebuild.
function msgEditor(msg, onType) {
  const root = document.createElement("div");
  root.className = "msgForm";
  const sel = document.createElement("select");
  sel.className = "msgType";
  ["note", "cc", "program"].forEach((t) => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
  sel.value = msgType(msg);
  root.appendChild(sel);
  const fields = document.createElement("div");
  fields.className = "msgFields";
  root.appendChild(fields);

  function renderFields() {
    fields.innerHTML = "";
    const t = msgType(msg);
    const keys = t === "note" ? ["note", "velocity"] : t === "cc" ? ["cc", "value"] : ["program"];
    keys.forEach((k) => {
      const l = document.createElement("label");
      l.textContent = k;
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = "1";
      inp.value = msg[k] !== undefined ? msg[k] : 0;
      inp.oninput = () => { msg[k] = parseInt(inp.value, 10); if (isNaN(msg[k])) msg[k] = 0; };
      l.appendChild(inp);
      fields.appendChild(l);
    });
  }
  renderFields();
  sel.onchange = () => { if (onType) onType(freshMsg(sel.value)); };
  return root;
}

function buildSoundForm() {
  // channel
  const chEl = $("sndChannel");
  chEl.innerHTML = "";
  const ch = document.createElement("label");
  ch.className = "inline";
  ch.innerHTML = "channel <input type='number' step='1' min='0' max='15' value='" +
                 (SOUND.channel !== undefined ? SOUND.channel : 0) + "'>";
  ch.querySelector("input").oninput = (e) => {
    SOUND.channel = parseInt(e.target.value, 10); if (isNaN(SOUND.channel)) SOUND.channel = 0;
  };
  chEl.appendChild(ch);

  // zones (one MIDI message per zone in the live table)
  const zEl = $("sndZones");
  zEl.innerHTML = "";
  Object.keys(TABLE.zones).forEach((name) => {
    if (!SOUND.zones[name]) SOUND.zones[name] = { note: 60, velocity: 60 };
    const row = document.createElement("div");
    row.className = "sndRow";
    const lbl = document.createElement("span");
    lbl.className = "sndName"; lbl.textContent = name;
    row.appendChild(lbl);
    row.appendChild(msgEditor(SOUND.zones[name], (fresh) => { SOUND.zones[name] = fresh; buildSoundForm(); }));
    zEl.appendChild(row);
  });

  // modes (one MIDI message per behaviour mode)
  const mEl = $("sndModes");
  mEl.innerHTML = "";
  MODES.forEach((mode) => {
    if (!SOUND.modes[mode]) SOUND.modes[mode] = { cc: 70, value: 64 };
    const row = document.createElement("div");
    row.className = "sndRow";
    const lbl = document.createElement("span");
    lbl.className = "sndName"; lbl.textContent = mode;
    row.appendChild(lbl);
    row.appendChild(msgEditor(SOUND.modes[mode], (fresh) => { SOUND.modes[mode] = fresh; buildSoundForm(); }));
    mEl.appendChild(row);
  });

  // actions (globally keyed: a start message + a list of per-pose messages)
  const aEl = $("sndActions");
  aEl.innerHTML = "";
  Object.keys(SOUND.actions).forEach((name) => {
    const act = SOUND.actions[name];
    const box = document.createElement("div");
    box.className = "action";
    // header: name + remove
    const head = document.createElement("div");
    head.className = "actionHead";
    const nm = document.createElement("input");
    nm.type = "text"; nm.value = name;
    nm.onchange = () => {
      const nn = nm.value.trim();
      if (!nn || nn === name) { nm.value = name; return; }
      SOUND.actions[nn] = act; delete SOUND.actions[name];
      buildSoundForm();
    };
    const rm = document.createElement("button");
    rm.className = "small"; rm.textContent = "remove";
    rm.onclick = () => { delete SOUND.actions[name]; buildSoundForm(); };
    head.appendChild(nm); head.appendChild(rm);
    box.appendChild(head);
    // start message
    if (!act.start) act.start = { note: 60, velocity: 60 };
    const s = document.createElement("div");
    s.className = "sndRow";
    const sl = document.createElement("span");
    sl.className = "sndName"; sl.textContent = "start";
    s.appendChild(sl);
    s.appendChild(msgEditor(act.start, (fresh) => { act.start = fresh; buildSoundForm(); }));
    box.appendChild(s);
    // per-pose messages
    if (!act.poses) act.poses = [];
    const pw = document.createElement("div");
    pw.className = "sndPoses";
    act.poses.forEach((pm, pi) => {
      const prow = document.createElement("div");
      prow.className = "sndRow";
      const pl = document.createElement("span");
      pl.className = "sndName"; pl.textContent = "pose " + (pi + 1);
      prow.appendChild(pl);
      prow.appendChild(msgEditor(pm, (fresh) => { act.poses[pi] = fresh; buildSoundForm(); }));
      const prx = document.createElement("button");
      prx.className = "small"; prx.textContent = "×";
      prx.onclick = () => { act.poses.splice(pi, 1); buildSoundForm(); };
      prow.appendChild(prx);
      pw.appendChild(prow);
    });
    const addP = document.createElement("button");
    addP.className = "small"; addP.textContent = "+ pose";
    addP.onclick = () => { act.poses.push({ note: 60, velocity: 60 }); buildSoundForm(); };
    pw.appendChild(addP);
    box.appendChild(pw);
    aEl.appendChild(box);
  });
}

function addSoundAction() {
  const nm = prompt("action name:", "new");
  if (!nm || SOUND.actions[nm]) return;
  SOUND.actions[nm] = { start: { note: 60, velocity: 60 }, poses: [] };
  buildSoundForm();
}

// ---------------------------------------------------------------------------
// Sound save (validate + POST the whole mapping).
// ---------------------------------------------------------------------------
function validMsg(msg) {
  if (typeof msg !== "object" || msg === null) return "message must be an object";
  const t = msgType(msg);
  const inRange = (v) => Number.isInteger(v) && v >= 0 && v <= 127;
  if (t === "note") return (inRange(msg.note) && inRange(msg.velocity)) ? "" : "note-on needs note + velocity (0-127)";
  if (t === "cc") return (inRange(msg.cc) && inRange(msg.value)) ? "" : "cc needs cc + value (0-127)";
  return inRange(msg.program) ? "" : "program change needs program (0-127)";
}

function validateSound() {
  const errs = [];
  const ch = SOUND.channel;
  if (!Number.isInteger(ch) || ch < 0 || ch > 15) errs.push("channel must be an int 0-15");
  for (const [where, table] of [["zones", SOUND.zones], ["modes", SOUND.modes]]) {
    for (const name of Object.keys(table)) {
      const e = validMsg(table[name]);
      if (e) errs.push(`${where}[${name}]: ${e}`);
    }
  }
  for (const name of Object.keys(SOUND.actions)) {
    const act = SOUND.actions[name];
    if (act.start) { const e = validMsg(act.start); if (e) errs.push(`actions[${name}].start: ${e}`); }
    (act.poses || []).forEach((pm, i) => { const e = validMsg(pm); if (e) errs.push(`actions[${name}].poses[${i}]: ${e}`); });
  }
  return errs;
}

function saveSound() {
  const errs = validateSound();
  if (errs.length) {
    $("saveMsg").textContent = errs.join("; ");
    $("saveMsg").className = "err";
    return;
  }
  fetch("/api/sound", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(SOUND),
  }).then((r) => r.json().then((body) => ({ ok: r.ok, body }))).then(({ ok, body }) => {
    if (ok) {
      $("saveMsg").textContent = "sound saved";
      $("saveMsg").className = "";
    } else {
      $("saveMsg").textContent = "sound save failed: " + (body.error || r.status);
      $("saveMsg").className = "err";
    }
  }).catch((e) => { $("saveMsg").textContent = "sound save failed: " + e; $("saveMsg").className = "err"; });
}

// ---------------------------------------------------------------------------
// Patches editor (hydra screen code).
//
// A patches table maps state to hydra code: ``default`` (the fallback) plus
// per-zone / per-mode / per-action entries. Match precedence is action > mode >
// zone > default (the core resolves this; the editor just edits the table). The
// live preview renders the selected slot's code on a dedicated hydra canvas.
// ---------------------------------------------------------------------------
function getPatchCode(key) {
  if (key === "default") return PATCHES.default;
  const idx = key.indexOf(".");
  const scope = key.slice(0, idx), name = key.slice(idx + 1);
  return (PATCHES[scope] && PATCHES[scope][name]) || "";
}

function setPatchCode(key, code) {
  if (key === "default") { PATCHES.default = code; return; }
  const idx = key.indexOf(".");
  const scope = key.slice(0, idx), name = key.slice(idx + 1);
  if (!PATCHES[scope]) PATCHES[scope] = {};
  PATCHES[scope][name] = code;
}

// Commit the textarea back to the selected slot (the textarea is the live edit buffer).
function commitPatchEditor() {
  if (selectedPatch) setPatchCode(selectedPatch, $("patchCode").value);
}

async function loadPatches() {
  let data = null;
  try {
    const r = await fetch("/api/patches", { cache: "no-store" });
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {
    try {
      const r = await fetch("/patches.json", { cache: "no-store" });
      if (r.ok) data = await r.json();
    } catch (e) {}
  }
  if (!data) data = JSON.parse(JSON.stringify(PATCHES_FALLBACK));
  PATCHES = data;
  if (typeof PATCHES.default !== "string") PATCHES.default = PATCHES_FALLBACK.default;
  if (!PATCHES.zones) PATCHES.zones = {};
  if (!PATCHES.modes) PATCHES.modes = {};
  if (!PATCHES.actions) PATCHES.actions = {};
  // Seed every zone / mode / action slot with the default code so the editor shows a
  // complete, offline-editable table. Only fills names not already present.
  const def = PATCHES.default;
  Object.keys(TABLE.zones).forEach((n) => { if (PATCHES.zones[n] === undefined) PATCHES.zones[n] = def; });
  MODES.forEach((m) => { if (PATCHES.modes[m] === undefined) PATCHES.modes[m] = def; });
  catalogActions().forEach((a) => { if (PATCHES.actions[a] === undefined) PATCHES.actions[a] = def; });
  if (selectedPatch === null) selectedPatch = "default";
  if (patchView) buildPatchesForm();
  return PATCHES;
}

// The live-preview hydra (one instance, created lazily on first use).
function ensurePatchHydra() {
  if (patchHydra) return patchHydra;
  if (typeof Hydra === "undefined") {
    $("patchStatus").textContent = "hydra-synth not loaded";
    return null;
  }
  const container = $("patchPreview");
  const canvas = document.createElement("canvas");
  // Match the 3D tool-screen resolution (single source of truth in rtr3d.js).
  const res = typeof Robot3D !== "undefined" ? Robot3D.screenResolution() : [640, 360];
  canvas.width = res[0]; canvas.height = res[1];
  container.appendChild(canvas);
  patchHydra = new Hydra({ canvas, detectAudio: false, makeGlobal: true, autoLoop: true });
  return patchHydra;
}

function evalPatchPreview(code) {
  const h = ensurePatchHydra();
  if (!h) return;
  try {
    h.eval(code || PATCHES_FALLBACK.default);
    $("patchStatus").textContent = "preview: running";
  } catch (e) {
    $("patchStatus").textContent = "preview error: " + (e && e.message ? e.message : e);
  }
}

function buildPatchesForm() {
  const listEl = $("patchList");
  listEl.innerHTML = "";
  const addGroup = (label) => {
    const g = document.createElement("div");
    g.className = "grp"; g.textContent = label;
    listEl.appendChild(g);
  };
  const addSlot = (key, label) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = key === selectedPatch ? "active" : "";
    b.onclick = () => {
      commitPatchEditor();
      selectedPatch = key;
      buildPatchesForm();
    };
    listEl.appendChild(b);
  };
  addGroup("default");
  addSlot("default", "default");
  addGroup("zones");
  Object.keys(TABLE.zones).forEach((n) => addSlot("zones." + n, n));
  addGroup("modes");
  MODES.forEach((m) => addSlot("modes." + m, m));
  addGroup("actions");
  Object.keys(PATCHES.actions).forEach((a) => addSlot("actions." + a, a));

  const code = getPatchCode(selectedPatch);
  $("patchCode").value = code;
  $("patchTitle").textContent = "patch: " + selectedPatch;
  $("patchInfo").textContent = "match precedence: action > mode > zone > default";
  evalPatchPreview(code);
}

function addPatchAction() {
  const nm = prompt("action name:", "new");
  if (!nm) return;
  if (!PATCHES.actions[nm]) {
    PATCHES.actions[nm] = PATCHES.default || PATCHES_FALLBACK.default;
    selectedPatch = "actions." + nm;
    buildPatchesForm();
  }
}

function removePatchSlot() {
  if (!selectedPatch || selectedPatch === "default") {
    $("saveMsg").textContent = "only action patches can be removed";
    $("saveMsg").className = "err";
    setTimeout(() => { $("saveMsg").className = ""; }, 3000);
    return;
  }
  const idx = selectedPatch.indexOf(".");
  const scope = selectedPatch.slice(0, idx), name = selectedPatch.slice(idx + 1);
  if (scope !== "actions") {
    $("saveMsg").textContent = "zone/mode patches follow the zone table; only actions can be removed";
    $("saveMsg").className = "err";
    setTimeout(() => { $("saveMsg").className = ""; }, 3000);
    return;
  }
  delete PATCHES.actions[name];
  selectedPatch = "default";
  buildPatchesForm();
}

function savePatches() {
  commitPatchEditor();
  const errs = [];
  if (typeof PATCHES.default !== "string" || !PATCHES.default) errs.push("default: must be a non-empty string");
  for (const [scope, table] of [["zones", PATCHES.zones], ["modes", PATCHES.modes], ["actions", PATCHES.actions]]) {
    for (const name of Object.keys(table)) {
      if (typeof table[name] !== "string" || !table[name]) errs.push(`${scope}[${name}]: must be a non-empty string`);
    }
  }
  if (errs.length) {
    $("saveMsg").textContent = errs.join("; ");
    $("saveMsg").className = "err";
    return;
  }
  fetch("/api/patches", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(PATCHES),
  }).then((r) => r.json().then((body) => ({ ok: r.ok, body }))).then(({ ok, body }) => {
    if (ok) {
      $("saveMsg").textContent = "patches saved";
      $("saveMsg").className = "";
    } else {
      $("saveMsg").textContent = "patches save failed: " + (body.error || r.status);
      $("saveMsg").className = "err";
    }
  }).catch((e) => { $("saveMsg").textContent = "patches save failed: " + e; $("saveMsg").className = "err"; });
}

// ---------------------------------------------------------------------------
// View switching (zones / sound / patches editors).
// ---------------------------------------------------------------------------
function switchView(v) {
  const wasPatch = patchView;
  soundView = v === "sound";
  patchView = v === "patches";
  if (wasPatch && !patchView) commitPatchEditor();  // leaving the patches view: commit
  $("zoneMain").style.display = (soundView || patchView) ? "none" : "";
  $("soundMain").style.display = soundView ? "" : "none";
  $("patchesMain").style.display = patchView ? "" : "none";
  $("tabZones").className = (soundView || patchView) ? "" : "active";
  $("tabSound").className = soundView ? "active" : "";
  $("tabPatches").className = patchView ? "active" : "";
  if (soundView) buildSoundForm();
  if (patchView) buildPatchesForm();
}

// ---------------------------------------------------------------------------
// Left: zone list.
// ---------------------------------------------------------------------------
function buildZoneList() {
  const el = $("zoneList");
  el.innerHTML = "";
  Object.keys(TABLE.zones).forEach((name) => {
    const b = document.createElement("button");
    b.textContent = name + (TABLE.zones[name].enabled === false ? " (off)" : "");
    b.className = name === selectedZone ? "active" : "";
    b.onclick = () => selectZone(name);
    el.appendChild(b);
  });
}

function selectZone(name) {
  selectedZone = name;
  const acts = (name && TABLE.zones[name].actions) ? TABLE.zones[name].actions : {};
  selectedAction = Object.keys(acts)[0] || null;
  ghostIndex = 0;
  buildZoneList();
  buildZoneForm();
  buildBars();
  updateGhost();
}

// ---------------------------------------------------------------------------
// Center: zone form.
// ---------------------------------------------------------------------------
function numGrid(id, values, oninput) {
  const g = document.createElement("div");
  g.className = "grid6";
  AXES.forEach((n, i) => {
    const l = document.createElement("label");
    l.textContent = n;
    const inp = document.createElement("input");
    inp.type = "number"; inp.step = "0.1";
    inp.value = values[i] != null ? values[i] : 0;
    inp.oninput = () => { oninput(parseFloat(inp.value), i); };
    l.appendChild(inp);
    g.appendChild(l);
  });
  return g;
}

function buildZoneForm() {
  const el = $("zoneForm");
  el.innerHTML = "";
  if (!selectedZone || !TABLE.zones[selectedZone]) {
    el.innerHTML = "<span style='color:var(--dim)'>no zone selected — add one</span>";
    $("zoneTitle").textContent = "zone";
    return;
  }
  const name = selectedZone;
  const z = TABLE.zones[name];
  if (!z.actions) z.actions = {};
  $("zoneTitle").textContent = "zone: " + name;

  // enabled + speed
  const row = document.createElement("div");
  row.className = "row";
  const en = document.createElement("label");
  en.className = "inline";
  en.innerHTML = `<input type="checkbox" ${z.enabled !== false ? "checked" : ""}> enabled`;
  en.querySelector("input").onchange = (e) => { z.enabled = e.target.checked; buildZoneList(); };
  row.appendChild(en);
  const sp = document.createElement("label");
  sp.className = "inline";
  sp.innerHTML = "speed <input type='number' step='1' value='" + (z.speed != null ? z.speed : 20) + "'>";
  sp.querySelector("input").oninput = (e) => { z.speed = parseFloat(e.target.value); };
  row.appendChild(sp);
  el.appendChild(row);

  // startpos
  el.appendChild(h3("startpos"));
  el.appendChild(numGrid("startpos", z.startpos, (v, i) => { z.startpos = list6(z.startpos); z.startpos[i] = v; }));
  // exitpos
  el.appendChild(h3("exitpos"));
  el.appendChild(numGrid("exitpos", z.exitpos, (v, i) => { z.exitpos = list6(z.exitpos); z.exitpos[i] = v; }));
  // safezone (lo / hi per axis)
  el.appendChild(h3("safezone (lo / hi)"));
  const sz = document.createElement("div");
  sz.style.display = "grid";
  sz.style.gridTemplateColumns = "36px 1fr 1fr";
  sz.style.gap = "4px";
  for (let i = 0; i < 6; i++) {
    const ax = document.createElement("span");
    ax.style.cssText = "font-size:11px;color:var(--dim);align-self:center";
    ax.textContent = AXES[i];
    sz.appendChild(ax);
    for (const k of [0, 1]) {
      const inp = document.createElement("input");
      inp.type = "number"; inp.step = "0.1";
      const pair = z.safezone && z.safezone[i] ? z.safezone[i] : [0, 0];
      inp.value = pair[k];
      inp.oninput = () => {
        if (!z.safezone) z.safezone = Array.from({length: 6}, () => [0, 0]);
        z.safezone[i][k] = parseFloat(inp.value);
        buildBars();
      };
      sz.appendChild(inp);
    }
  }
  el.appendChild(sz);

  // exits (checkboxes over other zones)
  el.appendChild(h3("exits"));
  const ex = document.createElement("div");
  ex.className = "row";
  Object.keys(TABLE.zones).forEach((on) => {
    if (on === name) return;
    const c = document.createElement("label");
    c.className = "inline";
    c.innerHTML = `<input type="checkbox" ${(z.exits || []).includes(on) ? "checked" : ""}> ${on}`;
    c.querySelector("input").onchange = (e) => {
      z.exits = z.exits || [];
      z.exits = e.target.checked ? [...z.exits, on] : z.exits.filter((x) => x !== on);
    };
    ex.appendChild(c);
  });
  el.appendChild(ex);

  // actions: include / exclude from the master catalog, then edit the included ones
  el.appendChild(h3("actions (include / exclude)"));
  buildActionToggles(el, name, z);
  buildActionList(el, name, z);

  const addA = document.createElement("button");
  addA.className = "small";
  addA.textContent = "+ add action";
  addA.onclick = () => {
    const nm = prompt("action name:", "new");
    if (!nm) return;
    z.actions[nm] = { enabled: true, pos: [[0,0,0,0,0,0]], speed: [10] };
    selectedAction = nm;
    buildZoneForm(); updateGhost();
  };
  el.appendChild(addA);
}

function h3(text) {
  const h = document.createElement("h3");
  h.textContent = text;
  return h;
}

function list6(arr) {
  if (Array.isArray(arr) && arr.length === 6) return arr.slice();
  return [0, 0, 0, 0, 0, 0];
}

// ---------------------------------------------------------------------------
// Per-zone action include / exclude.
//
// The master catalog is the ordered union of action names across all zones. A zone
// *includes* an action iff it has an entry in its own `actions` dict (the per-zone
// poses); *excluding* removes the entry. Including one the zone lacks seeds its poses
// from another zone that offers the same action (else the zone's own startpos).
// ---------------------------------------------------------------------------
function catalogActions() {
  const seen = new Set();
  const list = [];
  Object.keys(TABLE.zones).forEach((zn) => {
    const acts = TABLE.zones[zn].actions || {};
    Object.keys(acts).forEach((an) => {
      if (!seen.has(an)) { seen.add(an); list.push(an); }
    });
  });
  return list;
}

function seedAction(name, an) {
  const z = TABLE.zones[name];
  if (!z.actions) z.actions = {};
  for (const zn of Object.keys(TABLE.zones)) {
    const other = TABLE.zones[zn].actions || {};
    if (zn !== name && other[an] && other[an].pos) {
      z.actions[an] = {
        enabled: true,
        pos: other[an].pos.map((p) => (Array.isArray(p) && p.length === 6 ? p.slice() : [0, 0, 0, 0, 0, 0])),
        speed: (other[an].speed || []).slice(),
      };
      return;
    }
  }
  const sp = (Array.isArray(z.startpos) && z.startpos.length === 6) ? z.startpos.slice() : [0, 0, 0, 0, 0, 0];
  z.actions[an] = { enabled: true, pos: [sp], speed: [10] };
}

function buildActionToggles(el, name, z) {
  const cat = catalogActions();
  if (!cat.length) {
    const s = document.createElement("span");
    s.style.cssText = "color:var(--dim);font-size:12px";
    s.textContent = "no actions defined yet — add one below";
    el.appendChild(s);
    return;
  }
  const row = document.createElement("div");
  row.className = "row";
  cat.forEach((an) => {
    const c = document.createElement("label");
    c.className = "inline";
    c.innerHTML = `<input type="checkbox" ${z.actions && z.actions[an] ? "checked" : ""}> ${an}`;
    c.querySelector("input").onchange = (e) => {
      if (!z.actions) z.actions = {};
      if (e.target.checked) {
        if (!z.actions[an]) seedAction(name, an);
      } else {
        delete z.actions[an];
        if (selectedAction === an) selectedAction = null;
      }
      buildZoneForm(); updateGhost();
    };
    row.appendChild(c);
  });
  el.appendChild(row);
}

function buildActionList(container, name, z) {
  Object.keys(z.actions).forEach((an) => {
    const a = z.actions[an];
    const box = document.createElement("div");
    box.className = "action";
    // header: name + enabled + play + remove
    const head = document.createElement("div");
    head.className = "actionHead";
    const nm = document.createElement("input");
    nm.type = "text"; nm.value = an;
    nm.onchange = () => {
      const nn = nm.value.trim();
      if (!nn || nn === an) { nm.value = an; return; }
      z.actions[nn] = a; delete z.actions[an];
      selectedAction = nn;
      buildZoneForm();
    };
    const en = document.createElement("label");
    en.className = "inline";
    en.innerHTML = `<input type="checkbox" ${a.enabled !== false ? "checked" : ""}> on`;
    en.querySelector("input").onchange = (e) => { a.enabled = e.target.checked; };
    const play = document.createElement("button");
    play.className = "small"; play.textContent = "play";
    play.onclick = () => send({ cmd: "play_action", action: an });
    head.appendChild(nm); head.appendChild(en); head.appendChild(play);
    box.appendChild(head);

    // pose rows
    (a.pos || []).forEach((pose, pi) => {
      const pr = document.createElement("div");
      pr.className = "poseRow";
      pose = Array.isArray(pose) && pose.length === 6 ? pose : [0,0,0,0,0,0];
      for (let i = 0; i < 6; i++) {
        const inp = document.createElement("input");
        inp.type = "number"; inp.step = "0.1"; inp.value = pose[i];
        inp.oninput = () => { a.pos[pi][i] = parseFloat(inp.value); if (an === selectedAction) updateGhost(); };
        pr.appendChild(inp);
      }
      const spd = document.createElement("input");
      spd.type = "number"; spd.step = "1";
      spd.value = (a.speed && a.speed[pi]) != null ? a.speed[pi] : 10;
      spd.oninput = () => { a.speed = a.speed || []; a.speed[pi] = parseFloat(spd.value); };
      pr.appendChild(spd);
      const rx = document.createElement("button");
      rx.className = "small"; rx.textContent = "×";
      rx.onclick = () => {
        a.pos.splice(pi, 1);
        a.speed = a.speed || []; a.speed.splice(pi, 1);
        if (ghostIndex >= a.pos.length) ghostIndex = 0;
        buildZoneForm(); updateGhost();
      };
      pr.appendChild(rx);
      box.appendChild(pr);
    });

    const addR = document.createElement("button");
    addR.className = "small"; addR.textContent = "+ pose row";
    addR.onclick = () => {
      a.pos = a.pos || []; a.speed = a.speed || [];
      a.pos.push([0,0,0,0,0,0]);
      a.speed.push(10);
      buildZoneForm();
    };
    box.appendChild(addR);

    container.appendChild(box);
  });
}

// ---------------------------------------------------------------------------
// Right: safezone bars + ghost stepping.
// ---------------------------------------------------------------------------
function buildBars() {
  const el = $("bars");
  el.innerHTML = "";
  const z = TABLE.zones[selectedZone];
  if (!z || !z.safezone) return;
  const marks = [];
  for (let i = 0; i < 6; i++) {
    const ax = document.createElement("div");
    ax.className = "axis";
    const [lo, hi] = z.safezone[i];
    ax.innerHTML = `<div class="row"><span>${AXES[i]} <span style="color:var(--dim)">[${fmt(lo)}, ${fmt(hi)}]</span></span></div>` +
                   `<div class="bar"><div class="mark" id="bmark${i}"></div></div>`;
    el.appendChild(ax);
    marks.push(i);
  }
  updateGhost();
}

function currentGhostPose() {
  const z = TABLE.zones[selectedZone];
  if (!z || !z.actions || !selectedAction || !z.actions[selectedAction]) return null;
  const pos = z.actions[selectedAction].pos;
  if (!pos || !pos.length) return null;
  return pos[ghostIndex % pos.length];
}

function updateGhost() {
  const pose = currentGhostPose();
  const z = TABLE.zones[selectedZone];
  if (pose) Robot3D.setTarget(pose);
  $("ghostInfo").textContent = pose
    ? `${selectedAction} pose ${ghostIndex % (z.actions[selectedAction].pos.length)}`
    : "no action selected";
  // bars marker at the ghost pose
  if (z && z.safezone) {
    for (let i = 0; i < 6; i++) {
      const mark = $("bmark" + i);
      if (!mark) continue;
      const [lo, hi] = z.safezone[i];
      const v = pose ? pose[i] : (z.startpos ? z.startpos[i] : 0);
      const pct = hi > lo ? ((v - lo) / (hi - lo)) * 100 : 50;
      mark.style.left = Math.max(0, Math.min(100, pct)) + "%";
    }
  }
}

function stepGhost(dir) {
  const z = TABLE.zones[selectedZone];
  if (!z || !z.actions || !selectedAction || !z.actions[selectedAction]) return;
  const n = z.actions[selectedAction].pos.length;
  if (!n) return;
  ghostIndex = (ghostIndex + dir + n) % n;
  updateGhost();
}

// ---------------------------------------------------------------------------
// Save (validate + POST the whole table).
// ---------------------------------------------------------------------------
function validate() {
  const errs = [];
  const names = Object.keys(TABLE.zones);
  for (const name of names) {
    const z = TABLE.zones[name];
    if (!Array.isArray(z.startpos) || z.startpos.length !== 6) errs.push(`${name}: startpos needs 6 values`);
    if (!Array.isArray(z.exitpos) || z.exitpos.length !== 6) errs.push(`${name}: exitpos needs 6 values`);
    if (!Array.isArray(z.safezone) || z.safezone.length !== 6) errs.push(`${name}: safezone needs 6 pairs`);
    for (const e of (z.exits || [])) if (!TABLE.zones[e]) errs.push(`${name}: exit "${e}" does not exist`);
    for (const an of Object.keys(z.actions || {})) {
      const a = z.actions[an];
      if (!Array.isArray(a.pos) || !a.pos.length) { errs.push(`${name}/${an}: needs at least 1 pose`); continue; }
      a.pos.forEach((p, i) => { if (!Array.isArray(p) || p.length !== 6) errs.push(`${name}/${an}: pose ${i} needs 6 values`); });
      if (Array.isArray(a.speed) && a.speed.length !== a.pos.length) errs.push(`${name}/${an}: speed count != pose count`);
    }
  }
  return errs;
}

function save() {
  if (soundView) { saveSound(); return; }
  if (patchView) { savePatches(); return; }
  saveZones();
}

function saveZones() {
  const errs = validate();
  if (errs.length) {
    $("saveMsg").textContent = errs.join("; ");
    $("saveMsg").className = "err";
    return;
  }
  // Non-blocking warnings: action poses outside the zone's safezone, action poses
  // outside the hardware floor, and safezones wider than the hardware range. The core
  // clamps to the intersection (safezone ∩ hardware), so these are flags, not blockers.
  const warns = [];
  for (const name of Object.keys(TABLE.zones)) {
    const z = TABLE.zones[name];
    for (let ax = 0; ax < 6; ax++) {
      const [slo, shi] = z.safezone[ax];
      const [hlo, hhi] = HW_LIMITS[ax];
      if (slo < hlo || shi > hhi) warns.push(`${name}: safezone ${AXES[ax]} exceeds hardware [${hlo}, ${hhi}]`);
    }
    for (const an of Object.keys(z.actions || {})) {
      (z.actions[an].pos || []).forEach((p, i) => {
        for (let ax = 0; ax < 6; ax++) {
          const [lo, hi] = z.safezone[ax];
          if (p[ax] < lo || p[ax] > hi) warns.push(`${name}/${an} pose ${i} axis ${AXES[ax]} outside safezone`);
          const [hlo, hhi] = HW_LIMITS[ax];
          if (p[ax] < hlo || p[ax] > hhi) warns.push(`${name}/${an} pose ${i} axis ${AXES[ax]} outside hardware limits`);
        }
      });
    }
  }
  fetch("/api/zones", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(TABLE),
  }).then((r) => r.json().then((body) => ({ ok: r.ok, body }))).then(({ ok, body }) => {
    if (ok) {
      $("saveMsg").textContent = warns.length
        ? "saved — warning: " + warns[0] + (warns.length > 1 ? ` (+${warns.length - 1} more)` : "")
        : "saved";
      $("saveMsg").className = "";
    } else {
      $("saveMsg").textContent = "save failed: " + (body.error || r.status);
      $("saveMsg").className = "err";
    }
  }).catch((e) => { $("saveMsg").textContent = "save failed: " + e; $("saveMsg").className = "err"; });
}

// ---------------------------------------------------------------------------
// Init.
// ---------------------------------------------------------------------------
function addZone() {
  const nm = prompt("new zone name:", "newzone");
  if (!nm || TABLE.zones[nm]) return;
  TABLE.zones[nm] = {
    enabled: true,
    startpos: [0,0,0,0,0,0], exitpos: [0,0,0,0,0,0],
    safezone: [[-94,122],[-134,34],[-119,157],[-349,349],[-118,118],[-357,357]],
    exits: [], speed: 20, actions: {},
  };
  selectZone(nm);
}

function delZone() {
  if (!selectedZone) return;
  if (Object.keys(TABLE.zones).length <= 1) { $("saveMsg").textContent = "cannot remove the last zone"; return; }
  if (!confirm(`remove zone "${selectedZone}"?`)) return;
  delete TABLE.zones[selectedZone];
  const names = Object.keys(TABLE.zones);
  selectedZone = names[0];
  buildZoneList();
  selectZone(selectedZone);
}

Robot3D.init($("robot3d"), { log: (m) => console.log(m), environment: true });
// The live-preview textarea: commit + re-render (debounced) as the user types.
$("patchCode").oninput = () => {
  if (patchTimer) clearTimeout(patchTimer);
  patchTimer = setTimeout(() => {
    commitPatchEditor();
    evalPatchPreview($("patchCode").value);
  }, 300);
};
// Load the zone table first (the sound + patches editors seed their lists from the
// zone table's action names), then the sound mapping, then the patches, then open
// the WebSocket.
loadTable().then(loadSound).then(loadPatches).then(loadLimits).then(connect);
$("connect").onclick = () => { $("host").value = $("host").value.trim(); connect(); };
$("save").onclick = save;
$("addZone").onclick = addZone;
$("delZone").onclick = delZone;
$("tabZones").onclick = () => switchView("zones");
$("tabSound").onclick = () => switchView("sound");
$("tabPatches").onclick = () => switchView("patches");
$("addSoundAction").onclick = addSoundAction;
$("patchAdd").onclick = addPatchAction;
$("patchRemove").onclick = removePatchSlot;
$("ghostPrev").onclick = () => stepGhost(-1);
$("ghostNext").onclick = () => stepGhost(1);
</script>
