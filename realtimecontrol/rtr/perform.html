<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTR perform</title>
<style>
  :root {
    --bg: #111318; --panel: #181c24; --border: #2a2f3a;
    --text: #d7dbe2; --dim: #7c8494; --accent: #4fc08d; --warn: #e0a030;
    --late: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #e05d5d; }
  .dot.on { background: var(--accent); }
  #status { color: var(--dim); }
  #host { background: #0d0f13; color: var(--text); border: 1px solid var(--border);
          padding: 6px 8px; width: 260px; font: inherit; }
  button {
    background: #22262f; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 10px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0 0 10px; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0;
        border-bottom: 1px solid #20242d; }
  .kv > span:first-child { color: var(--dim); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; color: var(--dim); font-size: 12px; }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  .slider { width: 100%; margin: 8px 0; }
  .big { font-size: 28px; font-weight: bold; }
  .beatBar { height: 10px; background: #0d0f13; border-radius: 5px; margin-top: 6px; overflow: hidden; }
  .beatBar .fill { height: 100%; background: var(--accent); width: 0%; }
  .lateBox { border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-top: 8px; }
  .lateBox.ok { border-color: #2a4a3a; }
  .lateBox.late { border-color: var(--late); background: #2a1515; }
  .lateBox .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .lateBox .val { font-size: 18px; font-weight: bold; margin-top: 2px; }
  .lateBox.late .val { color: var(--late); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>RTR perform</h1>
  <span class="dot" id="dot"></span>
  <span id="status">disconnected</span>
  <input id="host" placeholder="ws://host:8765" />
  <button id="reconnect">connect</button>
</header>

<main>
  <section>
    <h2>Beat clock</h2>
    <div class="kv"><span>source</span><span id="clockSource">—</span></div>
    <div class="kv"><span>BPM</span><span id="bpm">—</span></div>
    <div class="kv"><span>beat</span><span id="beat" class="big">0.00</span></div>
    <div class="kv"><span>beat phase</span><span id="beatPhase">—</span></div>
    <div class="beatBar"><div class="fill" id="beatFill"></div></div>
    <div class="kv" style="margin-top:8px"><span>beat duration</span><span id="beatDuration">—</span></div>
  </section>

  <section>
    <h2>Velocity (CC-A)</h2>
    <div class="kv"><span>value</span><span id="velocityVal">0.00</span></div>
    <input type="range" id="velocity" class="slider" min="0" max="100" value="0" />
    <div class="kv"><span>degrees/sec</span><span id="velocityDeg">—</span></div>
    <div class="hint">CC-A sets the physical velocity directly.</div>
  </section>

  <section>
    <h2>Multiplier (CC-B)</h2>
    <div class="chips" id="multChips">
      <button data-m="0.0625">1/16</button>
      <button data-m="0.125">1/8</button>
      <button data-m="0.25">1/4</button>
      <button data-m="0.5">1/2</button>
      <button data-m="1">1x</button>
      <button data-m="2">2x</button>
      <button data-m="4">4x</button>
      <button data-m="8">8x</button>
      <button data-m="16">16x</button>
    </div>
    <div class="kv" style="margin-top:8px"><span>current</span><span id="multVal">1x</span></div>
  </section>

  <section>
    <h2>Deadline</h2>
    <div class="kv"><span>base beats</span><span id="baseBeats">—</span></div>
    <div class="kv"><span>deadline</span><span id="deadline">—</span></div>
    <div class="lateBox ok" id="lateBox">
      <div class="lbl">time to arrive</div>
      <div class="val" id="tta">—</div>
      <div class="hint" id="lateHint">not performing</div>
    </div>
  </section>

  <section>
    <h2>Live move</h2>
    <div class="kv"><span>zone</span><span id="zone">—</span></div>
    <div class="kv"><span>action</span><span id="action">—</span></div>
    <div class="kv"><span>moving</span><span id="moving">—</span></div>
  </section>
</main>

<script>
// ------------------------------------------------------------------
// RTR perform page: live MIDI-clock-driven performance controls.
//
// Reads the `perform` field from the 20 Hz state frames (the beat clock,
// velocity, multiplier, deadline, time-to-arrive, late flag) and the
// zone/action/moving state. Sends PERFORM_VELOCITY / PERFORM_MULTIPLIER
// commands to the core via the WebSocket.
// ------------------------------------------------------------------
let ws = null;
let PERFORM_CFG = { velocity_max_deg_s: 30.0 };

function $(id) { return document.getElementById(id); }

function setConn(on) {
  $("dot").className = "dot" + (on ? " on" : "");
  $("status").textContent = on ? "connected" : "disconnected";
}

function connect() {
  const url = $("host").value.trim();
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  ws = new WebSocket(url);
  ws.onopen = () => {
    setConn(true);
    ws.send(JSON.stringify({ cmd: "hello", client: "perform" }));
    fetchPerformConfig();
  };
  ws.onclose = () => {
    setConn(false);
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === "state") renderState(m);
  };
}

function fetchPerformConfig() {
  // The perform config (velocity range) comes from the HTTP server (/api/perform).
  // A relative fetch works when the page is served by the same host.
  fetch("/api/perform").then(r => r.json()).then(cfg => {
    PERFORM_CFG = cfg;
  }).catch(() => {});
}

function send(cmd) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(cmd));
}

function renderState(m) {
  const p = m.perform;
  // Live move state (always present in the state frame).
  $("zone").textContent = m.zone || "—";
  $("action").textContent = m.action || "—";
  $("moving").textContent = m.moving ? "yes" : "no";

  if (!p) {
    // No perform state (the clock isn't wired): show the idle state.
    $("clockSource").textContent = "—";
    $("bpm").textContent = "—";
    $("lateHint").textContent = "not performing";
    $("lateBox").className = "lateBox ok";
    return;
  }

  // Beat clock.
  $("clockSource").textContent = p.clock_source || "—";
  $("bpm").textContent = (p.bpm != null) ? p.bpm.toFixed(1) : "—";
  $("beat").textContent = (p.beat != null) ? p.beat.toFixed(2) : "—";
  $("beatPhase").textContent = (p.beat_phase != null) ? p.beat_phase.toFixed(3) : "—";
  $("beatDuration").textContent = (p.beat_duration != null) ? p.beat_duration.toFixed(3) + " s" : "—";
  const phase = (p.beat_phase != null) ? p.beat_phase : 0;
  $("beatFill").style.width = (Math.min(1, Math.max(0, phase)) * 100) + "%";

  // Velocity (CC-A).
  $("velocityVal").textContent = (p.velocity != null) ? p.velocity.toFixed(2) : "—";
  const deg = (p.velocity != null) ? p.velocity * PERFORM_CFG.velocity_max_deg_s : null;
  $("velocityDeg").textContent = (deg != null) ? deg.toFixed(1) + " °/s" : "—";

  // Multiplier (CC-B).
  const mult = p.multiplier || 1;
  $("multVal").textContent = mult + "x";
  for (const b of $("multChips").children) {
    b.className = (parseFloat(b.dataset.m) === mult) ? "active" : "";
  }

  // Deadline + time-to-arrive + late.
  $("baseBeats").textContent = (p.base_beats != null) ? p.base_beats : "—";
  $("deadline").textContent = (p.deadline != null) ? p.deadline.toFixed(3) + " s" : "—";
  const tta = p.time_to_arrive;
  $("tta").textContent = (tta != null && isFinite(tta)) ? tta.toFixed(3) + " s" : "∞";
  if (p.late) {
    $("lateBox").className = "lateBox late";
    $("lateHint").textContent = "LATE — raise velocity, extend multiplier, or lower BPM";
  } else {
    $("lateBox").className = "lateBox ok";
    $("lateHint").textContent = "on time";
  }
}

// Controls: CC-A velocity slider + CC-B multiplier buttons.
$("velocity").addEventListener("input", () => {
  const v = parseInt($("velocity").value, 10) / 100.0;
  send({ cmd: "perform_velocity", value: v });
});
for (const b of $("multChips").children) {
  b.addEventListener("click", () => {
    send({ cmd: "perform_multiplier", multiplier: parseFloat(b.dataset.m) });
  });
}

$("reconnect").addEventListener("click", connect);
// Default host: same machine, the WebSocket port.
$("host").value = "ws://" + location.hostname + ":8765";
connect();
</script>
</body>
</html>
