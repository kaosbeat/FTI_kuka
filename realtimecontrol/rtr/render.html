<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTR hydra render</title>
<style>
  :root { --bg: #000; --text: #d7dbe2; --dim: #7c8494; --accent: #4fc08d; --border: #2a2f3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(13,15,19,.72); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    pointer-events: none;
  }
  #hud .row { display: flex; gap: 8px; }
  #hud .k { color: var(--dim); }
  #hud .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #e05d5d; vertical-align: middle; }
  #hud .dot.on { background: var(--accent); }
  @font-face {
    font-family: "PressStart2P";
    src: url("/rtr/remote/PressStart2P.ttf") format("truetype");
    font-display: swap;
  }
  #codeOverlay {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; max-width: 80vw; max-height: 80vh; overflow: hidden;
    background: rgba(0,0,0,.85); border: 2px solid var(--accent); border-radius: 4px;
    padding: 16px 20px; color: #fff;
    font-family: "PressStart2P", monospace; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-all;
    pointer-events: none; display: none;
  }
  #camOverlay {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none; display: none;
  }
  #redLight {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 4; pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="hud">
  <div class="row"><span class="dot" id="dot"></span><span id="status">disconnected</span></div>
  <div class="row"><span class="k">zone</span><span id="zone">—</span></div>
  <div class="row"><span class="k">mode</span><span id="mode">—</span></div>
  <div class="row"><span class="k">action</span><span id="action">—</span></div>
  <div class="row"><span class="k">patch</span><span id="patchSlot">—</span></div>
  <div class="row"><span class="k">midi</span><span id="midiStatus">—</span></div>
</div>
<div id="codeOverlay"></div>
<canvas id="redLight"></canvas>
<canvas id="camOverlay"></canvas>

<script src="hydra-synth.js"></script>
<script src="video-registry.js"></script>
<script>
"use strict";

// The built-in hydra patch used when /api/patches is unreachable (mirrors
// rtr/patches/patches.py DEFAULT_HYDRA_CODE).
const DEFAULT_CODE = "osc(4, 0.1, 1.2).out()";

let PATCHES = { default: DEFAULT_CODE, zones: {}, modes: {}, actions: {} };
let hydra = null;
let lastCode = null;        // the code currently running in the preview
let ws = null;
let renderUi = { hud: true, code: false, cam: false };
// Live camera data for the camera-debug overlay (mirrors camera_debug.html's render):
// candidate boxes + track/compensated vectors drawn over the hydra canvas (no background).
let lastTelem = null;   // cam_telem payload (candidates/track/face/status)
let lastIntent = null;  // camera intent payload (has lock_id)
let lastServo = null;   // servo payload (dq_deg/dx/dy)
// The LED-wall red-light overlay (dead-pixel mask). Config comes from the state
// frame's red_light field (the core pushes it every tick); the beat clock is
// tracked from perform.beat/bpm and extrapolated between the 20 Hz frames.
let RED_LIGHT = { enabled: false, x: 0.5, y: 0.5, bar_w: 1, bar_h: 160, radius: 80, morph: true, per_beat: 1 };
let rlClock = { beat: 0, bpm: 120, lastT: null };
let rlGL = null;

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// Hydra: one fullscreen instance; the matched patch is re-eval'd only when the
// resolved code changes (so the render follows state without re-eval per tick).
// ---------------------------------------------------------------------------
function makeHydra() {
  if (hydra) return hydra;
  if (typeof Hydra === "undefined") { $("status").textContent = "hydra not loaded"; return null; }
  const canvas = document.createElement("canvas");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  $("stage").appendChild(canvas);
  hydra = new Hydra({ canvas, detectAudio: false, makeGlobal: true, autoLoop: true });
  return hydra;
}

function renderCode(code) {
  if (code === lastCode) return;
  const h = makeHydra();
  if (!h) return;
  try {
    h.eval(code || DEFAULT_CODE);
    lastCode = code || DEFAULT_CODE;
    $("patchSlot").textContent = slotLabel();
    // Update the code overlay (shows the running patch in PressStart2P).
    $("codeOverlay").textContent = lastCode;
  } catch (e) {
    console.log("hydra eval failed:", e);
  }
}

function applyRenderUi(ui) {
  if (!ui) return;
  renderUi = { hud: ui.hud !== false, code: ui.code === true, cam: ui.cam === true };
  $("hud").style.display = renderUi.hud ? "" : "none";
  $("codeOverlay").style.display = renderUi.code ? "block" : "none";
  $("camOverlay").style.display = renderUi.cam ? "block" : "none";
}

// ---------------------------------------------------------------------------
// Camera-debug overlay: draws the live cam_telem (candidate boxes + track /
// compensated vectors) over the hydra canvas, mirroring camera_debug.html. The
// 640x480 frame is fit "contain" (aspect preserved, centered) into the
// fullscreen overlay; only the content is drawn (no grid, status bar, or fill).
// ---------------------------------------------------------------------------
const FRAME_W = 640, FRAME_H = 480;
function camIsNum(v) { return typeof v === "number" && !isNaN(v); }

function camTransform() {
  const c = $("camOverlay");
  const cw = c.width, ch = c.height;
  const scale = Math.min(cw / FRAME_W, ch / FRAME_H);
  return { scale, ox: (cw - FRAME_W * scale) / 2, oy: (ch - FRAME_H * scale) / 2 };
}

function camToCanvas(t, fx, fy) {
  return [t.ox + fx * t.scale, t.oy + fy * t.scale];
}

// Map data coords into 640x480 frame space: pixels with explicit dims, or
// normalized 0..1 (mock), or default pixels (mirrors camera_debug detectScale).
function camDataScale(coords, candW, candH) {
  if (candW && candH) return [FRAME_W / candW, FRAME_H / candH];
  const m = Math.max(...coords);
  if (m <= 2) return [FRAME_W, FRAME_H];   // normalized 0..1
  return [1, 1];                            // pixels, default frame size
}

function camArrowHead(ctx, x0, y0, x1, y1, color) {
  const ang = Math.atan2(y1 - y0, x1 - x0);
  const size = 8;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - size * Math.cos(ang - 0.4), y1 - size * Math.sin(ang - 0.4));
  ctx.lineTo(x1 - size * Math.cos(ang + 0.4), y1 - size * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
}

function drawCamOverlay() {
  const c = $("camOverlay");
  if (!c) return;
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);   // transparent — no background fill
  if (!renderUi.cam) return;

  const t = camTransform();
  const cx = t.ox + (FRAME_W / 2) * t.scale;
  const cy = t.oy + (FRAME_H / 2) * t.scale;

  // image-center cross
  ctx.strokeStyle = "rgba(215,219,226,0.5)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - 12, cy); ctx.lineTo(cx + 12, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 12); ctx.stroke();

  const telem = lastTelem;
  if (!telem) return;   // no telemetry: only the reference cross

  const cands = (telem.candidates && telem.candidates.candidates) || [];
  const candW = telem.candidates && telem.candidates.w;
  const candH = telem.candidates && telem.candidates.h;
  const lockedId = telem.track && telem.track.id != null ? telem.track.id
                 : (lastIntent && lastIntent.lock_id != null ? lastIntent.lock_id : null);

  // candidate boxes
  for (const cd of cands) {
    if (!camIsNum(cd.x1) || !camIsNum(cd.y1) || !camIsNum(cd.x2) || !camIsNum(cd.y2)) continue;
    const [sx, sy] = camDataScale([cd.x1, cd.y1, cd.x2, cd.y2], candW, candH);
    const [X1, Y1] = camToCanvas(t, cd.x1 * sx, cd.y1 * sy);
    const [X2, Y2] = camToCanvas(t, cd.x2 * sx, cd.y2 * sy);
    const locked = lockedId != null && cd.id === lockedId;
    ctx.strokeStyle = locked ? "#e05d5d" : "#ff9f40";
    ctx.lineWidth = 2;
    ctx.strokeRect(X1, Y1, X2 - X1, Y2 - Y1);
    const conf = camIsNum(cd.conf) ? cd.conf.toFixed(2) : "";
    const label = "#" + cd.id + " " + conf + (locked ? " LOCK" : "");
    ctx.fillStyle = locked ? "#e05d5d" : "#ff9f40";
    ctx.font = "12px monospace";
    ctx.fillText(label, X1, Math.max(0, Y1 - 4));
  }

  // track: arrow from image center to the tracked point + cross marker
  if (telem.track) {
    const tr = telem.track;
    if (camIsNum(tr.cx) && camIsNum(tr.cy)) {
      const [sx, sy] = camDataScale([tr.cx, tr.cy]);
      const [px, py] = camToCanvas(t, tr.cx * sx, tr.cy * sy);
      ctx.strokeStyle = "#4fc08d";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
      camArrowHead(ctx, cx, cy, px, py, "#4fc08d");
      ctx.beginPath(); ctx.moveTo(px - 8, py); ctx.lineTo(px + 8, py); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py - 8); ctx.lineTo(px, py + 8); ctx.stroke();
      ctx.fillStyle = "#4fc08d";
      ctx.font = "12px monospace";
      const txt = "dx=" + (camIsNum(tr.dx) ? tr.dx.toFixed(1) : "-") +
                  " dy=" + (camIsNum(tr.dy) ? tr.dy.toFixed(1) : "-");
      ctx.fillText(txt, px + 12, py + 4);
    }
  }

  // compensated: the Jacobian-mapped joint command (dq_deg) the servo will drive.
  const sv = lastServo;
  if (sv && Array.isArray(sv.dq_deg) && sv.dq_deg.length) {
    const nrm = Math.sqrt(sv.dq_deg.reduce((a, b) => a + (camIsNum(b) ? b * b : 0), 0));
    if (nrm > 1e-3) {
      const len = Math.min(160, nrm * 6);
      const ox = camIsNum(sv.dx) ? sv.dx : 0, oy = camIsNum(sv.dy) ? sv.dy : 0;
      const omag = Math.sqrt(ox * ox + oy * oy) || 1;
      const ex = cx + (ox / omag) * len, ey = cy + (oy / omag) * len;
      ctx.strokeStyle = "#40a0ff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
      camArrowHead(ctx, cx, cy, ex, ey, "#40a0ff");
      ctx.fillStyle = "#40a0ff";
      ctx.font = "12px monospace";
      const dqTxt = "dq=" + sv.dq_deg.map((v) => camIsNum(v) ? v.toFixed(1) : "?").join(",");
      ctx.fillText(dqTxt, ex + 10, ey - 6);
    }
  }
}

// Keep the overlay canvas backing store matched to the window.
function sizeCamOverlay() {
  const c = $("camOverlay");
  if (!c) return;
  c.width = window.innerWidth;
  c.height = window.innerHeight;
}

// ---------------------------------------------------------------------------
// Red-light overlay (LED-wall dead-pixel mask): a pulsating CRT red light drawn
// in a WebGL fragment shader. It rests as a thin vertical bar (bar_w x bar_h)
// and blooms into a circle of `radius` px on every pulse, timed to the MIDI
// clock. The shape is a rounded-box SDF morphed from bar -> circle by the
// pulse envelope; scanlines + flicker + a soft glow give the CRT look. The
// output alpha is the light coverage, so the hydra canvas shows through where
// there is no light.
// ---------------------------------------------------------------------------
function normalizeRedLightClient(data) {
  const d = (data && typeof data === "object") ? data : {};
  const num = (v, def) => (typeof v === "number" && isFinite(v)) ? v : def;
  const out = { enabled: false, x: 0.5, y: 0.5, bar_w: 1, bar_h: 160, radius: 80, morph: true, per_beat: 1 };
  if (typeof d.enabled === "boolean") out.enabled = d.enabled;
  if (typeof d.morph === "boolean") out.morph = d.morph;
  out.x = Math.max(0, Math.min(1, num(d.x, out.x)));
  out.y = Math.max(0, Math.min(1, num(d.y, out.y)));
  out.bar_w = Math.max(1, num(d.bar_w, out.bar_w));
  out.bar_h = Math.max(1, num(d.bar_h, out.bar_h));
  out.radius = Math.max(1, num(d.radius, out.radius));
  out.per_beat = Math.max(0.05, num(d.per_beat, out.per_beat));
  return out;
}

// Seed the red-light config from the robot config (used until the first state
// frame carries a red_light field — older cores / provider not wired).
async function loadRedLightConfig() {
  for (const url of ["/api/robotconfig", "/robotconfig.json"]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.ok) {
        const data = await r.json();
        if (data && data.red_light) { RED_LIGHT = normalizeRedLightClient(data.red_light); return; }
      }
    } catch (e) {}
  }
}

function setupRedLight() {
  const c = $("redLight");
  if (!c) return null;
  const gl = c.getContext("webgl");
  if (!gl) return null;
  const vsSrc = "attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }";
  const fsSrc = [
    "precision mediump float;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform float u_env;",
    "uniform float u_morph;",
    "uniform float u_barW;",
    "uniform float u_barH;",
    "uniform float u_radius;",
    "uniform vec2 u_center;",
    "float hash(float n){ return fract(sin(n * 12.9898) * 43758.5453123); }",
    "float sdRoundedBox(vec2 p, vec2 b, float r){",
    "  vec2 q = abs(p) - b;",
    "  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;",
    "}",
    "void main(){",
    "  vec2 frag = gl_FragCoord.xy;",
    "  vec2 p = frag - u_center;",
    "  float e = u_env * u_morph;",
    "  float halfW = mix(u_barW * 0.5, u_radius, e);",
    "  float halfH = mix(u_barH * 0.5, u_radius, e);",
    "  float cr    = mix(u_barW * 0.5, u_radius, e);",
    "  float d = sdRoundedBox(p, vec2(halfW, halfH), cr);",
    "  float glow = 2.5;",
    "  float cov = 1.0 - smoothstep(-glow, glow + 2.0, d);",
    "  float core = 1.0 - smoothstep(0.0, max(halfW, 1.0) * 1.2, d);",
    "  float flicker = 0.90 + 0.10 * hash(floor(u_time * 24.0));",
    "  float scan = 0.88 + 0.12 * sin(frag.y * 1.7);",
    "  float bright = (0.30 + 0.70 * u_env) * flicker * scan;",
    "  float intensity = cov * bright;",
    "  vec3 red = vec3(1.0, 0.14, 0.09);",
    "  vec3 hot = vec3(1.0, 0.75, 0.55);",
    "  vec3 col = mix(red, hot, clamp(core * u_env, 0.0, 1.0)) * intensity;",
    "  vec2 uv = frag / u_res;",
    "  float vig = 1.0 - 0.18 * length(uv - 0.5);",
    "  col *= vig;",
    "  float alpha = clamp(intensity, 0.0, 1.0);",
    "  gl_FragColor = vec4(col, alpha);",
    "}",
  ].join("\n");
  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.log("red-light shader error:", gl.getShaderLog(s));
      return null;
    }
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, vsSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.log("red-light link error:", gl.getProgramInfoLog(prog));
    return null;
  }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.USAGE_STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "a_pos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {
    res: gl.getUniformLocation(prog, "u_res"),
    time: gl.getUniformLocation(prog, "u_time"),
    env: gl.getUniformLocation(prog, "u_env"),
    morph: gl.getUniformLocation(prog, "u_morph"),
    barW: gl.getUniformLocation(prog, "u_barW"),
    barH: gl.getUniformLocation(prog, "u_barH"),
    radius: gl.getUniformLocation(prog, "u_radius"),
    center: gl.getUniformLocation(prog, "u_center"),
  };
  gl.clearColor(0, 0, 0, 0);
  return { gl, prog, U, canvas: c };
}

function sizeRedLight() {
  const c = $("redLight");
  if (!c) return;
  c.width = window.innerWidth;
  c.height = window.innerHeight;
}

function rlFrame() {
  const now = performance.now();
  // Advance the beat clock (resynced to the core on each state frame; free-runs
  // at the last-known BPM otherwise — 120 when nothing has been seen yet).
  if (rlClock.lastT != null) {
    const dt = (now - rlClock.lastT) / 1000;
    rlClock.beat += dt * (rlClock.bpm / 60);
  }
  rlClock.lastT = now;
  const rl = rlGL;
  if (rl) {
    const c = rl.canvas, gl = rl.gl, U = rl.U;
    gl.viewport(0, 0, c.width, c.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (RED_LIGHT.enabled) {
      const phase = (rlClock.beat * RED_LIGHT.per_beat) % 1;
      const env = Math.pow(1 - phase, 3);
      gl.useProgram(rl.prog);
      gl.uniform2f(U.res, c.width, c.height);
      gl.uniform1f(U.time, now / 1000);
      gl.uniform1f(U.env, env);
      gl.uniform1f(U.morph, RED_LIGHT.morph ? 1 : 0);
      gl.uniform1f(U.barW, RED_LIGHT.bar_w);
      gl.uniform1f(U.barH, RED_LIGHT.bar_h);
      gl.uniform1f(U.radius, RED_LIGHT.radius);
      gl.uniform2f(U.center, RED_LIGHT.x * c.width, RED_LIGHT.y * c.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }
  requestAnimationFrame(rlFrame);
}

// ---------------------------------------------------------------------------
// Patch matching: action > mode > zone > default (mirrors the core's match_patch).
// ---------------------------------------------------------------------------
function matchPatch(zone, mode, action) {
  // The actions table is two-level (zone -> action -> code), so the action lookup
  // is scoped to the zone (mirrors the core's match_patch).
  if (zone && action) {
    const code = (PATCHES.actions || {})[zone] && (PATCHES.actions || {})[zone][action];
    if (typeof code === "string" && code) return code;
  }
  if (mode) {
    const code = (PATCHES.modes || {})[mode];
    if (typeof code === "string" && code) return code;
  }
  if (zone) {
    const code = (PATCHES.zones || {})[zone];
    if (typeof code === "string" && code) return code;
  }
  const d = PATCHES.default;
  return (typeof d === "string" && d) ? d : DEFAULT_CODE;
}

function slotLabel() {
  const z = $("zone").textContent, m = $("mode").textContent, a = $("action").textContent;
  if (z !== "—" && a !== "—" && (PATCHES.actions || {})[z] && (PATCHES.actions || {})[z][a]) return "action:" + a;
  if (m !== "—" && (PATCHES.modes || {})[m]) return "mode:" + m;
  if (z !== "—" && (PATCHES.zones || {})[z]) return "zone:" + z;
  return "default";
}

async function loadPatches() {
  let data = null;
  try {
    const r = await fetch("/api/patches", { cache: "no-store" });
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {
    try {
      const r = await fetch("/patches.json", { cache: "no-store" });
      if (r.ok) data = await r.json();
    } catch (e) {}
  }
  if (!data) data = { default: DEFAULT_CODE, zones: {}, modes: {}, actions: {} };
  PATCHES = data;
  if (typeof PATCHES.default !== "string") PATCHES.default = DEFAULT_CODE;
  if (!PATCHES.zones) PATCHES.zones = {};
  if (!PATCHES.modes) PATCHES.modes = {};
  if (!PATCHES.actions) PATCHES.actions = {};
  // Re-resolve the current patch with the fresh table.
  renderCode(matchPatch($("zone").textContent, $("mode").textContent, $("action").textContent));
}

// ---------------------------------------------------------------------------
// WebSocket (reuses client.html's transport pattern). State frames drive the
// patch; patches_changed re-fetches the table.
// ---------------------------------------------------------------------------
function connect() {
  const url = "ws://" + location.hostname + ":8765";
  ws = new WebSocket(url);
  ws.onopen = () => { $("dot").className = "dot on"; $("status").textContent = "connected"; loadPatches(); if (typeof preloadVideos === "function") preloadVideos(); };
  ws.onclose = () => {
    $("dot").className = "dot"; $("status").textContent = "disconnected; retrying";
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === "state") {
      $("zone").textContent = m.zone;
      $("mode").textContent = m.mode;
      $("action").textContent = m.action === null ? "—" : (m.action || "—");
      // The core pushes the resolved patch in the state frame (single source of truth);
      // prefer it. Fall back to local matching when it is absent (file:// or an older
      // core that does not push the patch).
      renderCode((typeof m.patch === "string" && m.patch) ? m.patch : matchPatch(m.zone, m.mode, m.action));
      // Capture the live camera data for the camera-debug overlay.
      lastTelem = m.cam_telem || null;
      lastIntent = m.camera || null;
      lastServo = m.servo || null;
      // The red-light overlay config (the core pushes it every tick); when absent
      // (older core / provider not wired) the fetched fallback stays in effect.
      if (m.red_light) RED_LIGHT = normalizeRedLightClient(m.red_light);
      // Track the MIDI-clock beat for the red-light pulse (resync on each frame;
      // the rAF loop extrapolates between the 20 Hz updates).
      if (m.perform && typeof m.perform.beat === "number") {
        rlClock.beat = m.perform.beat;
        rlClock.bpm = (typeof m.perform.bpm === "number" && m.perform.bpm > 0) ? m.perform.bpm : 120;
        rlClock.lastT = performance.now();
      }
      // Apply the render-page UI state (HUD / code-overlay / cam-overlay visibility).
      applyRenderUi(m.render_ui);
      drawCamOverlay();
    } else if (m.type === "patches_changed") {
      loadPatches();
    } else if (m.type === "zones_changed") {
      // Zones changed (video union may differ): re-warm the video registry.
      if (typeof preloadVideos === "function") preloadVideos();
    }
  };
}

// Keep the canvas sized to the window (hydra renders at the canvas resolution).
window.addEventListener("resize", () => {
  if (hydra) {
    const c = $("stage").querySelector("canvas");
    if (c) { c.width = window.innerWidth; c.height = window.innerHeight; }
  }
  sizeCamOverlay();
  sizeRedLight();
  drawCamOverlay();
});

// ---------------------------------------------------------------------------
// MIDI interactivity: load the hydra-midi extension so patches can use
// note('C4'), cc(45), etc. from local MIDI devices (Web MIDI).
// ---------------------------------------------------------------------------
async function setupMidi() {
  try {
    if (typeof loadScript !== "function") { $("midiStatus").textContent = "no loadScript"; return; }
    await loadScript("https://cdn.jsdelivr.net/npm/hydra-midi@latest/dist/index.js");
    // Current hydra-midi exposes a `Midi` class; older builds exposed a global `midi`.
    let m = null;
    if (typeof Midi === "function") m = new Midi({ debug: false, audio: false });
    else if (typeof midi !== "undefined" && midi) m = midi;
    if (!m) { $("midiStatus").textContent = "midi not loaded"; return; }
    await m.start();
    const inputs = navigator.requestMIDIAccess && navigator.requestMIDIAccess();
    if (inputs) {
      inputs.then((access) => {
        const names = [];
        for (const inp of access.inputs.values()) names.push(inp.name);
        $("midiStatus").textContent = names.length ? names.join(", ") : "no input";
      }).catch(() => { $("midiStatus").textContent = "midi denied"; });
    } else {
      $("midiStatus").textContent = "no web midi";
    }
  } catch (e) {
    console.log("midi setup failed:", e);
    $("midiStatus").textContent = "midi error";
  }
}

sizeCamOverlay();   // size the camera-overlay canvas to the window before the first frame
sizeRedLight();     // size the red-light canvas to the window before the first frame
rlGL = setupRedLight();   // build the red-light WebGL overlay (degrades to no-op when WebGL is unavailable)
loadRedLightConfig();     // seed the red-light config from the robot config (state frames override)
rlClock.lastT = performance.now();
requestAnimationFrame(rlFrame);   // start the red-light pulse loop (free-runs until a perform frame syncs it)
connect();
// Load the hydra-midi extension (patches can then use note()/cc() from local MIDI).
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", setupMidi);
} else {
  setupMidi();
}
</script>
